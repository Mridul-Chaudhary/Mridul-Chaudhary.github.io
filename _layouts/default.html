<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="site-frame">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark">MC</span>
          <span>Mridul Chaudhary</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          {% for item in site.data.navigation %}
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          {% endfor %}
        </nav>
      </header>

      <main>{{ content }}</main>

      <footer class="site-footer">
        <span>Bioinformatics, workflows, and translational research.</span>
        <span class="footer-links"><a href="mailto:mridulchaudhary93@gmail.com">Email</a><a href="https://www.linkedin.com/in/mridul-chaudhary-b7228778/">LinkedIn</a><a href="https://github.com/Mridul-Chaudhary">GitHub</a></span>
      </footer>
    </div>
  </body>
</html>
